<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prob8 — Offline Field Mode</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #090d16;
        color: #f8fafc;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        border: 1px solid #1e293b;
        background: #111827;
        border-radius: 16px;
        padding: 24px;
        text-align: center;
      }
      .badge {
        display: inline-block;
        padding: 6px 12px;
        border-radius: 10px;
        background: #0f766e;
        color: #fff;
        font-weight: 700;
        font-size: 13px;
        margin-bottom: 12px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        font-size: 13px;
        line-height: 1.5;
        color: #94a3b8;
        margin: 0 0 18px;
      }
      button {
        height: 40px;
        padding: 0 18px;
        border: 0;
        border-radius: 10px;
        background: #0f766e;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">P8 · Prob8</div>
      <h1>You&apos;re Currently Offline</h1>
      <p>
        Prob8 field routes, saved pipeline deals, and CRM contacts automatically sync back when connectivity returns.
      </p>
      <button onclick="window.location.reload()">Retry Connection</button>
    </div>
  </body>
</html>
